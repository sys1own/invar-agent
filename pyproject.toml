[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "invar-agent"
version = "0.1.0"
description = "Mathematically Verified Autonomous Agent Kernel and Web Console"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "z3-solver>=4.13",
    "libcst>=1.5",
    "blake3>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
invar-agent = "invar_agent.cli:main"

[tool.maturin]
python-source = "."
module-name = "invar_agent._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m \"not live\""
markers = ["live: requires a real provider API key (skipped by default)"]
